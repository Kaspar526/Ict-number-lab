<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="中四 ICT 互動數據表示：逐步探索二進制、十進制、十六進制轉換，以及二補碼的原理。"><title>數據表示實驗室 · 中四 ICT</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=2"><script src="app.js" defer></script></head>
<body><aside class="sidebar"><a class="brand" href="./"><span class="logo">01</span><span>數據表示<br><small>NUMBER LAB</small></span></a><div class="course">中四 ICT <span>必修 A · 資訊處理</span></div><nav aria-label="學習主題"><button id="nav-convert" class="nav-item active" data-mode="convert"><span>01</span> 進制轉換 <span class="nav-arrow">↗</span></button><button id="nav-twos" class="nav-item" data-mode="twos"><span>02</span> 二補碼 <span class="nav-arrow">↗</span></button></nav></aside>
<main><header><div class="breadcrumb">資訊處理 <span>/</span> 數據表示</div><span class="class-tag">互動學習</span></header><section class="intro"><div class="eyebrow" id="eyebrow">01 / NUMBER SYSTEMS</div><h1 id="title">進制轉換實驗室<span class="title-dot">.</span></h1><p id="subtitle">讓每個位值、每個餘數，都有跡可循。</p></section>
<section class="workspace"><div class="controls"><div class="section-head"><h2>設定你的數字</h2><span class="tiny">INPUT</span></div><div id="convert-controls"><div class="base-fields"><label>原本進制<select id="from"><option value="10">十進制 · DEC</option><option value="2">二進制 · BIN</option><option value="16">十六進制 · HEX</option></select></label><button id="swap" class="swap" aria-label="交換進制">⇄</button><label>目標進制<select id="to"><option value="2">二進制 · BIN</option><option value="10">十進制 · DEC</option><option value="16">十六進制 · HEX</option></select></label></div><label class="input-label" for="value">要轉換的數字</label><input id="value" value="37" autocomplete="off" spellcheck="false" maxlength="40"><p class="field-note">輸入非負整數；最多 16 個二進制位元（65535）。</p></div>
<div id="twos-controls" hidden><label>轉換方向<select id="direction"><option value="encode">十進制 → 二補碼</option><option value="decode">二補碼 → 十進制</option></select></label><label class="input-label">字長<select id="width"><option value="4">4 位元</option><option value="8" selected>8 位元</option><option value="16">16 位元</option></select></label><label class="input-label" for="signed-value" id="signed-label">十進制整數</label><input id="signed-value" value="-14" autocomplete="off" spellcheck="false" maxlength="40"><p class="field-note" id="range-note"></p></div>
<p id="error" role="alert" hidden></p><button id="start" class="primary start">開始逐步演示 <span>→</span></button><div class="examples"><span>試試教材例子</span><div id="examples"></div></div><div class="method"><span class="method-icon">i</span><div><b id="method-name"></b><p id="method-note"></p></div></div></div>
<div class="simulation"><div class="section-head"><h2>轉換過程</h2><span id="method-badge" class="badge"></span></div><div class="problem" id="problem"></div><div class="progress-label"><span id="step-label"></span><span id="progress-text"></span></div><div class="progress-track"><div id="progress"></div></div><div id="stage" aria-live="polite"></div><div class="playbar"><button id="reset" class="icon-btn" aria-label="重新播放">↺</button><button id="prev">← 上一步</button><button id="play">▷ 自動播放</button><button id="next" class="primary">下一步 →</button></div></div></section>
<section class="knowledge"><div class="section-head"><h2 id="knowledge-title">看懂背後的原理</h2><span class="tiny">THE WHY</span></div><div id="knowledge-body"></div></section><footer>數據表示實驗室 · 中四 ICT <span>教材第 3 章｜數系轉換 3.3–3.5 · 二補碼 3.10–3.13</span></footer></main></body></html>
